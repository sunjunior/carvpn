name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.3.11579264"

      - name: Unpack vendored hev-socks5-tunnel
        run: bash scripts/fetch_deps.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: bash ./gradlew test --stacktrace

      # assembleDebug compiles the native relay that release builds also use.
      - name: Build debug (compiles native relay)
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Stage relay executable into jniLibs source set
        run: |
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cp app/build/intermediates/cxx/Debug/*/obj/local/armeabi-v7a/carvpnrelay \
             app/src/main/jniLibs/armeabi-v7a/libcarvpnrelay.so

      - name: Rebuild debug APK to include relay
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Verify debug APK contains relay
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep -q carvpnrelay

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: carvpn-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not configured" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK (signed)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --stacktrace

      - name: Verify release APK (relay + signature)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -l "$APK" | grep -q carvpnrelay
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "carvpn-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" "carvpn-${GITHUB_REF_NAME}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "CarVPN ${GITHUB_REF_NAME}" \
            --notes "适用于 Android 车机的按应用 VPN 客户端（armeabi-v7a，Android 5.0+，实机验证 Android 6.0）。

          - 订阅导入（Clash，仅 type: http，支持 tls: true）
          - 多节点管理 + 自动选择最快可用节点（TLS 握手 + CONNECT 200 探活）
          - 出口网络自适应：有 WiFi 走 WiFi，没有 WiFi 走 eth0，运行中变化自动重绑
          - 按应用白名单、隧道内 DNS、故障切换
          - TLS 上游适配器，代理链路上的载荷全程加密
          - 开源许可：GPLv3

          安装：下载 APK 直接安装。本包由 GitHub Actions 从标签 ${GITHUB_REF_NAME} 自动构建并使用 release 密钥签名。

          注意：仅支持 armeabi-v7a；除 DNS 外不转发 UDP；targetSdk 23。"
